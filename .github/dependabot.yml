# Keeps the digest-pinned base images current. Dependabot opens a pull
# request when a new image is published under the pinned tag (new digest,
# security fixes included), so updates are reviewed rather than silent.
#
# Ubuntu: minor and major tag upgrades (e.g. 26.04 -> 26.10) are ignored,
# because they change R and package versions, which the pin exists to
# control. Move to a new Ubuntu tag deliberately, by hand.
#
# nginx: minor upgrades (e.g. 1.30 -> 1.31) are allowed. They don't affect
# the analysis, and each nginx branch stops getting images (and security
# fixes) once it's superseded, so ignoring them would freeze the web server.
version: 2
updates:
  - package-ecosystem: docker          # FROM line in Dockerfile
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose  # nginx image in compose.yaml
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
